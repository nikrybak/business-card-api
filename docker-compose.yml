services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U card -d card']
      interval: 2s
      retries: 15

  migrate:
    build:
      context: .
      target: build
    command: sh -c "npm run db:migrate && npm run db:seed"
    environment: &database
      DATABASE_URL: postgresql://card:card@db:5432/card
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: business-card-api
    environment: *database
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
