name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: card
          POSTGRES_PASSWORD: card
          POSTGRES_DB: card
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U card" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://card:card@localhost:5432/card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      - run: yarn db:migrate
      - run: yarn test:e2e
      - run: yarn build
