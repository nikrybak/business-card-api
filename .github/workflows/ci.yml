name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: card
          POSTGRES_PASSWORD: card
          POSTGRES_DB: card
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U card" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://card:card@localhost:5432/card
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:e2e
      - run: git diff --exit-code schema.gql
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: docker compose up --build --wait api
      - run: npm run check:image
      - run: npm run smoke -- http://localhost:3000
      - if: always()
        run: docker compose logs

  migrate-production:
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production-database
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}?sslmode=verify-full
